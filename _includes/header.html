<header class="site-header">
  <div class="container">
    <div class="header-content">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      
      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label">
        <span></span>
      </label>
      
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        {% assign sorted_attractions = site.attractions | sort: 'order' %}
        {% for attraction in sorted_attractions %}
          <a href="{{ attraction.url | relative_url }}" class="{% if page.url == attraction.url %}active{% endif %}">{{ attraction.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </div>
</header>
