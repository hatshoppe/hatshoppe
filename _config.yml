title: "Town Attractions"
description: "Discover the best attractions in our town"
# Update these values for your GitHub Pages deployment:
# baseurl: "/repository-name"  # Your repository name (leave empty if using custom domain)
# url: "https://username.github.io"  # Your GitHub Pages URL
baseurl: ""
url: "https://username.github.io"

# Collections configuration
collections:
  attractions:
    output: true
    permalink: /:collection/:name/

# Default front matter values
defaults:
  - scope:
      path: ""
      type: "attractions"
    values:
      layout: "attraction"

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Build settings
markdown: kramdown
sass:
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .kiro/
